<svg xmlns="http://www.w3.org/2000/svg" width="880" height="242" viewBox="0 0 880 242" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<style>@font-face{font-family:'Manrope';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style>
<rect x="0.5" y="0.5" width="879" height="241" rx="8" fill="#ffffff" stroke="#dfe5e1"/>
<text x="28" y="42" font-size="18" font-weight="700" fill="#14201a">14 alertas en cuatro categorías</text>
